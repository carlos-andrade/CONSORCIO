name: GOVERNANCA — validação documental diária

on:
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "automation/audit_repository_documents.py"
      - ".github/workflows/governanca-diaria.yml"

permissions:
  contents: read

concurrency:
  group: governanca-diaria-main
  cancel-in-progress: false

jobs:
  validar-governanca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CONSORCIO
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Checkout GOVERNANCA — fonte normativa
        uses: actions/checkout@v4
        with:
          repository: carlos-andrade/GOVERNANCA
          ref: main
          path: .governanca-master
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Auditar documentos
        id: audit
        continue-on-error: true
        run: |
          python automation/audit_repository_documents.py \
            --repo-root . \
            --governance-root .governanca-master \
            --report GOVERNANCA/relatorio-diario.md \
            --json GOVERNANCA/relatorio-diario.json
      - name: Guardar relatórios da execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consorcio-governanca-${{ github.run_number }}
          path: |
            GOVERNANCA/relatorio-diario.md
            GOVERNANCA/relatorio-diario.json
          if-no-files-found: warn
          retention-days: 90
      - name: Falhar perante erros documentais
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::A auditoria encontrou falhas documentais. Consultar os artefactos desta execução."
          exit 1
